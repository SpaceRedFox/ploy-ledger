<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D1117" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PLOY'S LEDGER" />
  <title>PLOY'S LEDGER // 16-Bit Retro Cloud v2.0</title>

  <!-- Typography: JetBrains Mono (16px Base for iOS Anti-Zoom & High Legibility) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Supabase JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ============================================================================
       MASTER SPECIFICATION LOCK (SRS v1.0.4 + SUPABASE CLOUD SYNC v2.0)
       ============================================================================ */
    :root, [data-theme="light"] {
      --bg-base: #F7F4EB;
      --bg-grid: rgba(30, 41, 59, 0.06);
      --bg-panel: #FFFDF8;
      --bg-panel-alt: #EFECE1;
      --bg-input: #FFFFFF;
      --border-outer: #1E2430;
      --border-inner: #8C95A6;
      --highlight: #FFFFFF;
      --shadow-hard: #1E2430;

      --text-main: #18202C;
      --text-muted: #475569;
      --text-dim: #64748B;

      --cat-income: #0D9488;
      --cat-income-bg: #CCFBF1;
      --cat-savings: #0284C7;
      --cat-savings-bg: #E0F2FE;
      --cat-fixed: #D97706;
      --cat-fixed-bg: #FEF3C7;
      --cat-variable: #E11D48;
      --cat-variable-bg: #FFE4E6;

      --accent-gold: #EAB308;
      --accent-gold-text: #18202C;
      --accent-sky: #0284C7;
      --accent-sky-text: #FFFFFF;

      --net-black: #000000;
      --net-red: #DC2626;
      --net-orange: #EA580C;

      --row-current-bg: rgba(13, 148, 136, 0.12);
      --row-selected-bg: rgba(234, 179, 8, 0.24);
    }

    [data-theme="dark"] {
      --bg-base: #0D1117;
      --bg-grid: rgba(148, 163, 184, 0.05);
      --bg-panel: #161B22;
      --bg-panel-alt: #21262D;
      --bg-input: #090D13;
      --border-outer: #010409;
      --border-inner: #3B4452;
      --highlight: #2D3542;
      --shadow-hard: #010409;

      --text-main: #E6EDF3;
      --text-muted: #9BA6B4;
      --text-dim: #6E7681;

      --cat-income: #34D399;
      --cat-income-bg: rgba(52, 211, 153, 0.15);
      --cat-savings: #38BDF8;
      --cat-savings-bg: rgba(56, 189, 248, 0.15);
      --cat-fixed: #FBBF24;
      --cat-fixed-bg: rgba(251, 191, 36, 0.15);
      --cat-variable: #FB7185;
      --cat-variable-bg: rgba(251, 113, 133, 0.15);

      --accent-gold: #FBBF24;
      --accent-gold-text: #0D1117;
      --accent-sky: #38BDF8;
      --accent-sky-text: #090D13;

      --net-black: #9BA6B4;
      --net-red: #FB7185;
      --net-orange: #FB923C;

      --row-current-bg: rgba(52, 211, 153, 0.13);
      --row-selected-bg: rgba(251, 191, 36, 0.20);
    }

    * {
      box-sizing: border-box;
      border-radius: 0px !important;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image:
        linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    .pixel-box {
      background: var(--bg-panel);
      border: 3px solid var(--border-outer);
      box-shadow:
        inset 0 0 0 2px var(--border-inner),
        inset 0 0 0 4px var(--highlight),
        4px 4px 0px var(--shadow-hard);
      position: relative;
    }

    .pixel-subbox {
      background: var(--bg-panel-alt);
      border: 2px solid var(--border-outer);
      box-shadow: inset 2px 2px 0px var(--highlight);
    }

    .pixel-rivets::before,
    .pixel-rivets::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--accent-gold);
      top: 6px;
      pointer-events: none;
    }
    .pixel-rivets::before { left: 6px; }
    .pixel-rivets::after { right: 6px; }

    .pixel-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 46px;
      min-width: 46px;
      padding: 10px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      background: var(--bg-panel-alt);
      border: 3px solid var(--border-outer);
      box-shadow:
        inset -2px -2px 0px rgba(0, 0, 0, 0.25),
        inset 2px 2px 0px var(--highlight),
        4px 4px 0px var(--shadow-hard);
      cursor: pointer;
      user-select: none;
      text-decoration: none;
      transition: transform 0.04s steps(1);
    }

    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow:
        inset 2px 2px 0px rgba(0, 0, 0, 0.3),
        2px 2px 0px var(--shadow-hard);
    }

    .pixel-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .pixel-btn-gold {
      background: var(--accent-gold);
      color: var(--accent-gold-text);
      box-shadow:
        inset -2px -2px 0px rgba(0, 0, 0, 0.25),
        inset 2px 2px 0px rgba(255, 255, 255, 0.45),
        4px 4px 0px var(--shadow-hard);
    }

    .pixel-btn-sky {
      background: var(--accent-sky);
      color: var(--accent-sky-text);
    }

    .pixel-btn-danger {
      background: #E11D48;
      color: #FFFFFF;
    }

    .pixel-label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .pixel-input, .pixel-select {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--bg-input);
      border: 3px solid var(--border-outer);
      box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.22);
      outline: none;
    }

    .pixel-input:focus, .pixel-select:focus {
      border-color: var(--accent-gold);
      box-shadow: inset 2px 2px 0px rgba(0, 0, 0, 0.22), 0 0 0 2px var(--accent-gold);
    }

    .app-shell {
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px 12px 96px;
    }

    @media (min-width: 768px) {
      .app-shell { padding: 18px 18px 36px; }
    }

    .top-header {
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pixel-emblem {
      width: 46px;
      height: 46px;
      background: var(--bg-panel-alt);
      border: 2px solid var(--border-outer);
      box-shadow: inset 0 0 0 2px var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
      line-height: 1.2;
      color: var(--accent-gold);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .desktop-tabs {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (min-width: 768px) {
      .desktop-tabs { display: grid; }
    }

    .desktop-tabs .pixel-btn.active {
      background: var(--accent-gold);
      color: var(--accent-gold-text);
    }

    .mobile-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 400;
      background: var(--bg-panel);
      border-top: 3px solid var(--border-outer);
      box-shadow: 0 -2px 0 var(--border-inner);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 5px;
      gap: 5px;
    }

    @media (min-width: 768px) {
      .mobile-dock { display: none; }
    }

    .dock-btn {
      min-height: 58px;
      background: var(--bg-panel-alt);
      border: 2px solid var(--border-outer);
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      padding: 4px;
    }

    .dock-btn.active {
      background: var(--accent-gold);
      color: var(--accent-gold-text);
      box-shadow: inset 2px 2px 0px rgba(255, 255, 255, 0.45);
    }

    .cat-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    @media (min-width: 640px) {
      .cat-cards-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .cat-card-btn {
      min-height: 68px;
      padding: 10px 8px;
      background: var(--bg-panel-alt);
      border: 3px solid var(--border-outer);
      box-shadow: 3px 3px 0px var(--shadow-hard);
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align: center;
    }

    .cat-card-btn .cat-en { font-size: 13px; font-weight: 800; }
    .cat-card-btn .cat-th { font-size: 12px; font-weight: 600; color: var(--text-muted); }

    .cat-card-btn.selected[data-cat="Income"] {
      background: var(--cat-income-bg);
      border-color: var(--cat-income);
      color: var(--cat-income);
    }
    .cat-card-btn.selected[data-cat="Savings"] {
      background: var(--cat-savings-bg);
      border-color: var(--cat-savings);
      color: var(--cat-savings);
    }
    .cat-card-btn.selected[data-cat="Fixed_Expense"] {
      background: var(--cat-fixed-bg);
      border-color: var(--cat-fixed);
      color: var(--cat-fixed);
    }
    .cat-card-btn.selected[data-cat="Variable_Expense"] {
      background: var(--cat-variable-bg);
      border-color: var(--cat-variable);
      color: var(--cat-variable);
    }
    .cat-card-btn.selected .cat-th { color: inherit; }

    .quick-add-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .quick-add-grid .pixel-btn {
      padding: 6px 4px;
      font-size: 13px;
      min-height: 44px;
    }

    .cycle-bar {
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 768px) {
      .cycle-bar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .cycle-mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .cycle-nav-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .cycle-display {
      flex: 1;
      text-align: center;
      padding: 6px 10px;
      min-width: 185px;
    }

    .cycle-title { font-size: 15px; font-weight: 800; color: var(--accent-gold); }
    .cycle-dates { font-size: 12px; font-weight: 700; color: var(--text-muted); }

    .kpi-grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (min-width: 768px) {
      .kpi-grid-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .kpi-grid-5 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (min-width: 768px) {
      .kpi-grid-5 { grid-template-columns: repeat(5, 1fr); }
    }

    .kpi-card {
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-card-wide { grid-column: span 2; }
    @media (min-width: 768px) { .kpi-card-wide { grid-column: span 1; } }

    .kpi-label { font-size: 12px; font-weight: 800; color: var(--text-muted); }
    .kpi-value { font-size: 18px; font-weight: 800; word-break: break-word; }

    .c-income { color: var(--cat-income); }
    .c-savings { color: var(--cat-savings); }
    .c-fixed { color: var(--cat-fixed); }
    .c-variable { color: var(--cat-variable); }

    .net-bal-black { color: var(--net-black) !important; }
    .net-bal-red { color: var(--net-red) !important; }
    .net-bal-orange { color: var(--net-orange) !important; }

    .badge-cat {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      font-size: 12px;
      font-weight: 800;
      border: 2px solid var(--border-outer);
      white-space: nowrap;
    }
    .badge-Income { background: var(--cat-income-bg); color: var(--cat-income); border-color: var(--cat-income); }
    .badge-Savings { background: var(--cat-savings-bg); color: var(--cat-savings); border-color: var(--cat-savings); }
    .badge-Fixed_Expense { background: var(--cat-fixed-bg); color: var(--cat-fixed); border-color: var(--cat-fixed); }
    .badge-Variable_Expense { background: var(--cat-variable-bg); color: var(--cat-variable); border-color: var(--cat-variable); }

    .stacked-bar-track {
      display: flex;
      width: 100%;
      height: 22px;
      background: var(--bg-input);
      border: 3px solid var(--border-outer);
      overflow: hidden;
    }

    .stacked-seg {
      height: 100%;
      transition: width 0.2s steps(6);
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 8px,
        rgba(0, 0, 0, 0.22) 8px,
        rgba(0, 0, 0, 0.22) 10px
      );
    }

    .sub-bar-track {
      width: 100%;
      height: 14px;
      background: var(--bg-input);
      border: 2px solid var(--border-outer);
      padding: 1px;
    }

    .sub-bar-fill {
      height: 100%;
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 8px,
        rgba(0, 0, 0, 0.25) 8px,
        rgba(0, 0, 0, 0.25) 10px
      );
    }

    .filter-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .filter-pill-btn {
      min-height: 44px;
      padding: 6px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      background: var(--bg-panel-alt);
      border: 2px solid var(--border-outer);
      color:
