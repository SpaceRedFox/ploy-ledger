<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D1117" id="metaThemeColor" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PLOY'S LEDGER" />
  <title>PLOY'S LEDGER // 16-Bit Retro Edition v1.0.4</title>

  <!-- Typography: JetBrains Mono (16px Base for iOS Anti-Zoom & High Legibility) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* ============================================================================
       MASTER SPECIFICATION LOCK (SRS v1.0.4 - IMMUTABLE CORE RULES)
       ============================================================================
       1. EXACT TAXONOMY LOCK (4 Main Categories, 25 Exact Sub-Categories):
          - Income (5): ["Salary", "Bonus", "Dividend", "Interest", "Others"]
          - Savings (5): ["Retirement_PVD", "Emergency_Cash", "Emergency_AOTCOOP", "Travel", "Investment"]
          - Fixed_Expense (6): ["WHT", "Life/Health Insurance", "Car Insurance", "Condo Maintenance Fee", "Personal Trainer", "Debt Repayment"]
          - Variable_Expense (9): ["Food & Beverage", "Non Food", "Utilities", "Gasoline", "Subscription", "Credit Card Installment", "Books & Education", "Bread-Making", "Others"]
       2. STRICT 2-MODE THEME SYSTEM:
          - Only 2 explicit modes: "DAY" (16-Bit Pastel) and "NIGHT" (16-Bit Modern Black, zero purple).
          - Initial default on first visit (when no saved theme_mode exists): 06:00-17:59 = "DAY", 18:00-05:59 = "NIGHT".
          - Header button toggles directly between "☀️ Day" and "🌙 Night" in 1 tap.
       3. DATA SCHEMA & DUAL PAY-CYCLE ENGINE:
          - LocalStorage keys: `pixel_ledger_txs_v1` & `pixel_ledger_cfg_v1` (`schema_version: "1.0.0"`).
          - Integer satang (`amount_satang = Math.round(thb * 100)`), ISO date `YYYY-MM-DD`, UI date `22 Nov 2026`.
          - 26TH PAY CYCLE (Sat/Sun adjusted backward to Friday, counts toward next month) & CALENDAR (1-31).
          - 3 Tabs:
            * Tab 1: "➕ บันทึกรายการ" (Default) -> Step 1: Date (with Today shortcut), Step 2: Main Category, Step 3: Sub-Category, Step 4: Amount + Quick-Add, Step 5: Note.
            * Tab 2: "📅 Daily" -> Pay-Cycle toggle, KPIs, 4-category stacked bar, filter pills & history.
            * Tab 3: "📊 Dashboard" -> Annual KPIs, 12-month bar chart, 12-month table with auto CURRENT highlight & click drill-down.
       4. NET BALANCE CONDITIONAL TEXT COLOR RULES (LOCKED):
          - Net Balance > 5,000.00 THB (> 500000 satang)        -> Black text
          - Net Balance < 0.00 THB (< 0 satang)                -> Red text
          - Net Balance >= 0.00 THB and <= 5,000.00 THB        -> Orange text
       ============================================================================ */

    :root, [data-theme="light"] {
      /* Day Mode: Warm Cream & Crisp Pastel 16-Bit Retro */
      --bg-base: #F7F4EB;
      --bg-grid: rgba(30, 41, 59, 0.06);
      --bg-panel: #FFFDF8;
      --bg-panel-alt: #EFECE1;
      --bg-input: #FFFFFF;
      --border-outer: #1E2430;
      --border-inner: #8C95A6;
      --highlight: #FFFFFF;
      --shadow-hard: #1E2430;

      --text-main: #18202C;
      --text-muted: #475569;
      --text-dim: #64748B;

      /* Category Palette (Day) */
      --cat-income: #0D9488;
      --cat-income-bg: #CCFBF1;
      --cat-savings: #0284C7;
      --cat-savings-bg: #E0F2FE;
      --cat-fixed: #D97706;
      --cat-fixed-bg: #FEF3C7;
      --cat-variable: #E11D48;
      --cat-variable-bg: #FFE4E6;

      --accent-gold: #EAB308;
      --accent-gold-text: #18202C;
      --accent-sky: #0284C7;
      --accent-sky-text: #FFFFFF;

      /* Net Balance Conditional Text Colors */
      --net-black: #000000;
      --net-red: #DC2626;
      --net-orange: #EA580C;

      --row-current-bg: rgba(13, 148, 136, 0.12);
      --row-selected-bg: rgba(234, 179, 8, 0.24);
    }

    [data-theme="dark"] {
      /* Night Mode: Modern Obsidian & Slate 16-Bit Retro (Zero Purple) */
      --bg-base: #0D1117;
      --bg-grid: rgba(148, 163, 184, 0.05);
      --bg-panel: #161B22;
      --bg-panel-alt: #21262D;
      --bg-input: #090D13;
      --border-outer: #010409;
      --border-inner: #3B4452;
      --highlight: #2D3542;
      --shadow-hard: #010409;

      --text-main: #E6EDF3;
      --text-muted: #9BA6B4;
      --text-dim: #6E7681;

      /* Category Palette (Night - High-contrast Pastel-Neon on Obsidian) */
      --cat-income: #34D399;
      --cat-income-bg: rgba(52, 211, 153, 0.15);
      --cat-savings: #38BDF8;
      --cat-savings-bg: rgba(56, 189, 248, 0.15);
      --cat-fixed: #FBBF24;
      --cat-fixed-bg: rgba(251, 191, 36, 0.15);
      --cat-variable: #FB7185;
      --cat-variable-bg: rgba(251, 113, 133, 0.15);

      --accent-gold: #FBBF24;
      --accent-gold-text: #0D1117;
      --accent-sky: #38BDF8;
      --accent-sky-text: #090D13;

      /* Net Balance Conditional Text Colors */
      --net-black: #000000;
      --net-red: #FB7185;
      --net-orange: #FB923C;

      --row-current-bg: rgba(52, 211, 153, 0.13);
      --row-selected-bg: rgba(251, 191, 36, 0.20);
    }

    /* Strict 0px Pixelate Geometry */
    * {
      box-sizing: border-box;
      border-radius: 0px !important;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image:
        linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .hidden {
      display: none !important;
    }

    /* 16-Bit RPG Window Container */
    .pixel-box {
      background: var(--bg-panel);
      border: 3px solid var(--border-outer);
      box-shadow:
        inset 0 0 0 2px var(--border-inner),
        inset 0 0 0 4px var(--highlight),
        4px 4px 0px var(--shadow-hard);
      position: relative;
    }

    .pixel-subbox {
      background: var(--bg-panel-alt);
      border: 2px solid var(--border-outer);
      box-shadow: inset 2px 2px 0px var(--highlight);
    }

    /* Corner Rivets */
    .pixel-rivets::before,
    .pixel-rivets::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--accent-gold);
      top: 6px;
      pointer-events: none;
    }
    .pixel-rivets::before { left: 6px; }
    .pixel-rivets::after { right: 6px; }

    /* Tactile 16-Bit Buttons (Minimum 44x44px Touch Target) */
    .pixel-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 46px;
      min-width: 46px;
      padding: 10px 14px;
      font-family: 'JetBrains Mono', monospace;
