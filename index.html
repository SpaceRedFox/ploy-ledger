<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ploy's Ledger — 16-Bit Personal Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       MASTER SPEC: PLOY'S LEDGER (16-BIT PIXEL RETRO)
       - Day Mode: Pastel Comfort
       - Night Mode: Modern Black (Zero Purple)
       - Rule: Net Balance > 5,000.00 THB in Night Mode -> Grey Text (#cbd5e1)
       - Rule: Entry Form Box width matches Top KPI Card (100% width)
       ========================================================================== */
    :root {
      /* Day Pastel Theme */
      --bg-base: #fdfbf7;
      --bg-grid: rgba(148, 163, 184, 0.15);
      --bg-panel: #ffffff;
      --bg-panel-alt: #f4f1ea;
      --bg-input: #faf8f5;
      --border-outer: #2d3748;
      --border-inner: #cbd5e1;
      --shadow-hard: #1e293b;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-income: #16a34a;
      --accent-savings: #0284c7;
      --accent-fixed: #d97706;
      --accent-variable: #e11d48;
      --accent-primary: #3b82f6;
      --net-high-color: #15803d; /* สีเขียวเข้มในโหมดกลางวัน */
    }

    [data-theme="dark"] {
      /* Modern Black Night Theme */
      --bg-base: #0a0a0c;
      --bg-grid: rgba(255, 255, 255, 0.04);
      --bg-panel: #141418;
      --bg-panel-alt: #1e1e24;
      --bg-input: #0e0e11;
      --border-outer: #000000;
      --border-inner: #3f3f46;
      --shadow-hard: #000000;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-income: #4ade80;
      --accent-savings: #38bdf8;
      --accent-fixed: #fbbf24;
      --accent-variable: #fb7185;
      --accent-primary: #60a5fa;
      --net-high-color: #cbd5e1; /* ปรับเฉพาะสีอักษรใน Theme Night เป็นสีเทา กรณี Net Balance > 5,000.00 */
    }

    * {
      box-sizing: border-box;
      border-radius: 0px !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      background-image:
        linear-gradient(to right, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--bg-grid) 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .tabular { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }

    /* Container หลักคุมความกว้างให้การ์ดด้านบนและกล่องบันทึกกว้างเท่ากัน */
    .app-shell {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 12px 84px;
    }

    /* 16-Bit Pixel Window */
    .pixel-card {
      width: 100%;
      background: var(--bg-panel);
      border: 3px solid var(--border-outer);
      box-shadow:
        inset 0 0 0 2px var(--border-inner),
        4px 4px 0px var(--shadow-hard);
      padding: 14px;
      margin-bottom: 12px;
    }

    .pixel-subbox {
      background: var(--bg-panel-alt);
      border: 2px solid var(--border-outer);
      padding: 10px;
    }

    /* Header HUD */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-box {
      width: 44px;
      height: 44px;
      background: var(--bg-panel-alt);
      border: 2px solid var(--border-outer);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Buttons */
    .px-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      background: var(--bg-panel-alt);
      border: 2px solid var(--border-outer);
      box-shadow: 3px 3px 0px var(--shadow-hard);
      cursor: pointer;
      user-select: none;
    }
    .px-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--shadow-hard);
    }
    .px-btn-primary {
      background: var(--accent-primary);
      color: #090d16;
    }
    .px-btn-sm {
      min-height: 34px;
      padding: 4px 10px;
      font-size: 11px;
    }

    /* Inputs */
    .px-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .px-input, .px-select {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--bg-input);
      border: 2px solid var(--border-outer);
      outline: none;
    }
    .px-input:focus, .px-select:focus {
      border-color: var(--accent-primary);
    }

    /* KPI Summary Grid (การ์ดด้านบน) */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 600px) {
      .kpi-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .kpi-item {
      text-align: center;
      padding: 10px 6px;
    }
    .kpi-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .kpi-value {
      font-size: 15px;
      font-weight: 800;
      margin-top: 4px;
      word-break: break-word;
    }

    /* เงื่อนไขสีของ Net Balance */
    .net-balance-high {
      color: var(--net-high-color) !important;
    }
    .net-balance-normal {
      color: var(--text-main);
    }
    .net-balance-negative {
      color: var(--accent-variable) !important;
    }

    /* Form Grid ภายในกล่องบันทึกรายการ (ขยายเต็มความกว้างเท่าการ์ดบน) */
    .entry-form-box {
      width: 100%;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    @media (min-width: 540px) {
      .form-grid-2 { grid-template-columns: 1fr 1fr; }
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .nav-tabs .px-btn.active {
      background: var(--accent-primary);
      color: #090d16;
    }

    /* Transaction List */
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 2px dashed var(--border-inner);
    }
    .tx-item:last-child { border-bottom: none; }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      border: 2px solid var(--border-outer);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    th, td {
      padding: 8px;
      border: 1px solid var(--border-inner);
      text-align: right;
      white-space: nowrap;
    }
    th:first-child, td:first-child {
      text-align: left;
      font-weight: 700;
      background: var(--bg-panel-alt);
    }
    tr.highlight-month td {
      background: rgba(96, 165, 250, 0.16);
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- TOP HEADER -->
  <header class="pixel-card top-bar">
    <div class="brand-group">
      <div class="avatar-box" title="Ploy's Avatar">
        <!-- Pixel Art สาวน้อยผมแกละ ยิ้มแป้น -->
        <svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
          <rect x="4" y="2" width="8" height="2" fill="#3b2f2f"/>
          <rect x="2" y="4" width="2" height="4" fill="#3b2f2f"/>
          <rect x="12" y="4" width="2" height="4" fill="#3b2f2f"/>
          <rect x="4" y="4" width="8" height="7" fill="#fde68a"/>
          <rect x="5" y="6" width="1" height="2" fill="#1e293b"/>
          <rect x="10" y="6" width="1" height="2" fill="#1e293b"/>
          <rect x="4" y="8" width="1" height="1" fill="#fb7185"/>
          <rect x="11" y="8" width="1" height="1" fill="#fb7185"/>
          <rect x="6" y="9" width="4" height="1" fill="#e11d48"/>
          <rect x="5" y="11" width="6" height="4" fill="#38bdf8"/>
        </svg>
      </div>
      <div>
        <div style="font-weight:800; font-size:14px;">PLOY'S LEDGER</div>
        <div id="cycleDateRange" style="font-size:11px; color:var(--text-muted);">รอบเงินเดือนวันที่ 26</div>
      </div>
    </div>

    <div style="display:flex; gap:6px;">
      <button type="button" class="px-btn px-btn-sm" id="btnToggleTheme">☀️ / 🌙</button>
      <button type="button" class="px-btn px-btn-sm" id="btnExportCsv">CSV</button>
      <button type="button" class="px-btn px-btn-sm" id="btnExportJson">JSON</button>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="nav-tabs">
    <button type="button" class="px-btn active" data-view="viewEntry">➕ บันทึกรายการ</button>
    <button type="button" class="px-btn" data-view="viewHistory">📜 ประวัติรายการ</button>
    <button type="button" class="px-btn" data-view="viewDashboard">📊 Dashboard</button>
  </nav>

  <!-- TOP KPI CARD (การ์ดสรุปยอดด้านบน) -->
  <section class="pixel-card" id="topSummaryCard">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">
      <button type="button" class="px-btn px-btn-sm" id="btnPrevCycle">◀</button>
      <div style="text-align:center;">
        <div id="cycleTitle" style="font-weight:800; font-size:13px;">รอบปัจจุบัน</div>
        <div id="cycleSubRange" style="font-size:11px; color:var(--text-muted);"></div>
      </div>
      <button type="button" class="px-btn px-btn-sm" id="btnNextCycle">▶</button>
    </div>

    <div class="kpi-grid">
      <div class="pixel-subbox kpi-item">
        <div class="kpi-title">INCOME</div>
        <div class="kpi-value tabular" id="kpiIncome" style="color:var(--accent-income);">0.00</div>
      </div>
      <div class="pixel-subbox kpi-item">
        <div class="kpi-title">SAVINGS</div>
        <div class="kpi-value tabular" id="kpiSavings" style="color:var(--accent-savings);">0.00</div>
      </div>
      <div class="pixel-subbox kpi-item">
        <div class="kpi-title">EXPENSE</div>
        <div class="kpi-value tabular" id="kpiExpense" style="color:var(--accent-variable);">0.00</div>
      </div>
      <div class="pixel-subbox kpi-item">
        <div class="kpi-title">NET BALANCE</div>
        <div class="kpi-value tabular" id="kpiNetBalance">0.00</div>
      </div>
    </div>
  </section>

  <!-- VIEW 1: บันทึกรายการ (ขยายกรอบกว้างเต็ม 100% เท่าการ์ดด้านบน) -->
  <section id="viewEntry" class="pixel-card entry-form-box">
    <div style="font-weight:800; font-size:13px; margin-bottom:12px;">
      📝 บันทึกรายรับ-รายจ่าย (QUICK ENTRY)
    </div>

    <form id="ledgerForm">
      <input type="hidden" id="editTxId" value="">

      <div class="form-grid-2">
        <div>
          <label class="px-label">วันที่ (DATE)</label>
          <input type="date" id="txDate" class="px-input" required>
        </div>
        <div>
          <label class="px-label">จำนวนเงิน (THB)</label>
          <input type="number" id="txAmount" class="px-input tabular" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
      </div>

      <div class="form-grid-2">
        <div>
          <label class="px-label">หมวดหมู่หลัก (MAIN CATEGORY)</label>
          <select id="txMainCat" class="px-select">
            <option value="Variable_Expense">Variable_Expense</option>
            <option value="Fixed_Expense">Fixed_Expense</option>
            <option value="Income">Income</option>
            <option value="Savings">Savings</option>
          </select>
        </div>
        <div>
          <label class="px-label">หมวดหมู่ย่อย (SUB-CATEGORY)</label>
          <select id="txSubCat" class="px-select"></select>
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <label class="px-label">บันทึกช่วยจำ (NOTE)</label>
        <input type="text" id="txNote" class="px-input" placeholder="ระบุรายละเอียดเพิ่มเติม...">
      </div>

      <div style="display:flex; gap:8px;">
        <button type="submit" class="px-btn px-btn-primary" style="flex:1; font-size:13px;">
          💾 บันทึกรายการ
        </button>
        <button type="button" class="px-btn hidden" id="btnCancelEdit">ยกเลิก</button>
      </div>
    </form>
  </section>

  <!-- VIEW 2: ประวัติรายการในรอบนี้ -->
  <section id="viewHistory" class="pixel-card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div style="font-weight:800; font-size:13px;">📜 รายการในรอบบัญชีนี้</div>
      <select id="filterMainCat" class="px-select" style="width:auto; min-height:34px; padding:4px 8px; font-size:11px;">
        <option value="ALL">ทุกหมวดหมู่</option>
        <option value="Income">Income</option>
        <option value="Savings">Savings</option>
        <option value="Fixed_Expense">Fixed_Expense</option>
        <option value="Variable_Expense">Variable_Expense</option>
      </select>
    </div>
    <div id="txHistoryList" class="pixel-subbox" style="padding:0;"></div>
  </section>

  <!-- VIEW 3: DASHBOARD รายปี -->
  <section id="viewDashboard" class="pixel-card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">
      <div style="font-weight:800; font-size:13px;">📊 DASHBOARD รายเดือน</div>
      <select id="dashCycleMode" class="px-select" style="width:auto; min-height:34px; padding:4px 8px; font-size:11px;">
        <option value="CUSTOM">ตามรอบเงินเดือน (26)</option>
        <option value="CALENDAR">ตามเดือนปฏิทิน (1-31)</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>เดือน</th>
            <th>Income</th>
            <th>Savings</th>
            <th>Fixed</th>
            <th>Variable</th>
            <th>Net</th>
          </tr>
        </thead>
        <tbody id="dashboardTableBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  /* ==========================================================================
     LOCKED SCHEMA & CATEGORIES (v1.0.0)
     ========================================================================== */
  const CATEGORIES = {
    Income: ["Salary", "Bonus", "Dividend", "Interest", "Others"],
    Savings: ["Retirement_PVD", "Emergency_Cash", "Emergency_AOTCOOP", "Travel", "Investment"],
    Fixed_Expense: ["WHT", "Life/Health Insurance", "Car Insurance", "Condo Maintenance Fee", "Personal Trainer", "Debt Repayment"],
    Variable_Expense: ["Food & Beverage", "Non Food", "Utilities", "Gasoline", "Subscription", "Credit Card Installment", "Books & Education", "Bread-Making", "Others"]
  };

  const MONTHS_TH = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  const STORAGE_KEY = "ploys_ledger_v1";

  let state = {
    schema_version: "1.0.0",
    settings: {
      currency: "THB",
      cycle_mode: "CUSTOM",
      pay_cycle_day: 26,
      adjust_weekend: true,
      theme: "dark"
    },
    transactions: []
  };

  let cycleOffset = 0;

  // โหลดข้อมูลจาก LocalStorage
  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && Array.isArray(parsed.transactions)) {
          state = { ...state, ...parsed };
        }
      }
    } catch (e) {
      console.error("Failed to load state:", e);
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // คำนวณวันเริ่มรอบเงินเดือน (วันที่ 26 เลื่อนหลบวันเสาร์-อาทิตย์)
  function getAdjustedPayDate(year, monthIndex) {
    let d = new Date(year, monthIndex, 26);
    const day = d.getDay();
    if (day === 6) d.setDate(25); // เสาร์ -> ศุกร์ที่ 25
    if (day === 0) d.setDate(24); // อาทิตย์ -> ศุกร์ที่ 24
    return d;
  }

  function getCycleBounds(offset = 0) {
    const now = new Date();
    let baseYear = now.getFullYear();
    let baseMonth = now.getMonth();

    const currentPayStart = getAdjustedPayDate(baseYear, baseMonth);
    if (now < currentPayStart) {
      baseMonth -= 1;
    }

    const targetStartYear = new Date(baseYear, baseMonth + offset, 1).getFullYear();
    const targetStartMonth = new Date(baseYear, baseMonth + offset, 1).getMonth();
    const start = getAdjustedPayDate(targetStartYear, targetStartMonth);

    const nextMonthDate = new Date(targetStartYear, targetStartMonth + 1, 1);
    const nextStart = getAdjustedPayDate(nextMonthDate.getFullYear(), nextMonthDate.getMonth());
    const end = new Date(nextStart);
    end.setDate(end.getDate() - 1);
    end.setHours(23, 59, 59, 999);

    return {
      start,
      end,
      labelMonth: MONTHS_TH[nextMonthDate.getMonth()],
      labelYear: nextMonthDate.getFullYear()
    };
  }

  function formatDateISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatDateThai(isoStr) {
    const [y, m, d] = isoStr.split("-").map(Number);
    return `${d} ${MONTHS_TH[m - 1]} ${y}`;
  }

  function formatTHB(satang) {
    return (satang / 100).toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  // อัปเดตตัวเลือกหมวดหมู่ย่อย
  function populateSubCategories() {
    const mainCat = document.getElementById("txMainCat").value;
    const subSelect = document.getElementById("txSubCat");
    const subs = CATEGORIES[mainCat] || [];
    subSelect.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join("");
  }

  // อัปเดตการแสดงผล KPI และสีของ Net Balance ตามเงื่อนไข Theme Night
  function renderSummaryAndList() {
    const bounds = getCycleBounds(cycleOffset);
    document.getElementById("cycleTitle").textContent = `รอบ ${bounds.labelMonth} ${bounds.labelYear}`;
    document.getElementById("cycleSubRange").textContent =
      `${formatDateThai(formatDateISO(bounds.start))} - ${formatDateThai(formatDateISO(bounds.end))}`;

    const startIso = formatDateISO(bounds.start);
    const endIso = formatDateISO(bounds.end);

    const cycleTxs = state.transactions.filter(tx => tx.date >= startIso && tx.date <= endIso);

    let incomeSatang = 0;
    let savingsSatang = 0;
    let expenseSatang = 0;

    cycleTxs.forEach(tx => {
      if (tx.main_category === "Income") incomeSatang += tx.amount_satang;
      else if (tx.main_category === "Savings") savingsSatang += tx.amount_satang;
      else expenseSatang += tx.amount_satang;
    });

    const netSatang = incomeSatang - savingsSatang - expenseSatang;
    const netTHB = netSatang / 100;

    document.getElementById("kpiIncome").textContent = formatTHB(incomeSatang);
    document.getElementById("kpiSavings").textContent = formatTHB(savingsSatang);
    document.getElementById("kpiExpense").textContent = formatTHB(expenseSatang);

    const netEl = document.getElementById("kpiNetBalance");
    netEl.textContent = formatTHB(netSatang);

    // ตรวจสอบเงื่อนไข Net Balance > 5,000.00 THB
    netEl.classList.remove("net-balance-high", "net-balance-normal", "net-balance-negative");
    if (netTHB > 5000.00) {
      netEl.classList.add("net-balance-high"); // ใน Theme Night จะแสดงเป็นสีเทา (#cbd5e1)
    } else if (netTHB < 0) {
      netEl.classList.add("net-balance-negative");
    } else {
      netEl.classList.add("net-balance-normal");
    }

    renderTransactionList(cycleTxs);
    renderDashboard();
  }

  function renderTransactionList(cycleTxs) {
    const filter = document.getElementById("filterMainCat").value;
    const container = document.getElementById("txHistoryList");
    const filtered = filter === "ALL"
      ? cycleTxs
      : cycleTxs.filter(t => t.main_category === filter);

    if (filtered.length === 0) {
      container.innerHTML = `<div style="padding:16px; text-align:center; color:var(--text-muted);">ยังไม่มีรายการในรอบนี้</div>`;
      return;
    }

    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date));
    container.innerHTML = sorted.map(tx => {
      let color = "var(--accent-variable)";
      if (tx.main_category === "Income") color = "var(--accent-income)";
      else if (tx.main_category === "Savings") color = "var(--accent-savings)";
      else if (tx.main_category === "Fixed_Expense") color = "var(--accent-fixed)";

      return `
        <div class="tx-item">
          <div style="min-width:0; flex:1;">
            <div style="font-weight:700; font-size:12px;">${tx.sub_category} <span style="font-size:10px; color:var(--text-muted);">(${tx.main_category})</span></div>
            <div style="font-size:11px; color:var(--text-muted);">${formatDateThai(tx.date)}${tx.note ? " • " + tx.note : ""}</div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="tabular" style="font-weight:800; color:${color};">${formatTHB(tx.amount_satang)}</span>
            <button type="button" class="px-btn px-btn-sm" onclick="editTx('${tx.id}')">✏️</button>
            <button type="button" class="px-btn px-btn-sm" onclick="deleteTx('${tx.id}')">🗑️</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderDashboard() {
    const mode = document.getElementById("dashCycleMode").value;
    const tbody = document.getElementById("dashboardTableBody");
    const now = new Date();
    const year = now.getFullYear();
    const currentMonth = now.getMonth();

    let rowsHtml = "";
    for (let m = 0; m < 12; m++) {
      let startIso, endIso;
      if (mode === "CALENDAR") {
        startIso = formatDateISO(new Date(year, m, 1));
        endIso = formatDateISO(new Date(year, m + 1, 0));
      } else {
        const prevMonth = new Date(year, m - 1, 1);
        const start = getAdjustedPayDate(prevMonth.getFullYear(), prevMonth.getMonth());
        const nextStart = getAdjustedPayDate(year, m);
        const end = new Date(nextStart);
        end.setDate(end.getDate() - 1);
        startIso = formatDateISO(start);
        endIso = formatDateISO(end);
      }

      const txs = state.transactions.filter(t => t.date >= startIso && t.date <= endIso);
      let inc = 0, sav = 0, fix = 0, vari = 0;
      txs.forEach(t => {
        if (t.main_category === "Income") inc += t.amount_satang;
        else if (t.main_category === "Savings") sav += t.amount_satang;
        else if (t.main_category === "Fixed_Expense") fix += t.amount_satang;
        else vari += t.amount_satang;
      });
      const net = inc - sav - fix - vari;
      const isCurrent = m === currentMonth;

      rowsHtml += `
        <tr class="${isCurrent ? "highlight-month" : ""}">
          <td>${MONTHS_TH[m]} ${year}${isCurrent ? " ★" : ""}</td>
          <td class="tabular" style="color:var(--accent-income);">${formatTHB(inc)}</td>
          <td class="tabular" style="color:var(--accent-savings);">${formatTHB(sav)}</td>
          <td class="tabular" style="color:var(--accent-fixed);">${formatTHB(fix)}</td>
          <td class="tabular" style="color:var(--accent-variable);">${formatTHB(vari)}</td>
          <td class="tabular">${formatTHB(net)}</td>
        </tr>
      `;
    }
    tbody.innerHTML = rowsHtml;
  }

  // บันทึก / แก้ไข / ลบ รายการ
  document.getElementById("ledgerForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const editId = document.getElementById("editTxId").value;
    const date = document.getElementById("txDate").value;
    const amountVal = parseFloat(document.getElementById("txAmount").value);
    const mainCat = document.getElementById("txMainCat").value;
    const subCat = document.getElementById("txSubCat").value;
    const note = document.getElementById("txNote").value.trim();

    if (!date || isNaN(amountVal) || amountVal <= 0) return;
    const amountSatang = Math.round(amountVal * 100);

    if (editId) {
      const idx = state.transactions.findIndex(t => t.id === editId);
      if (idx !== -1) {
        state.transactions[idx] = {
          ...state.transactions[idx],
          date,
          main_category: mainCat,
          sub_category: subCat,
          amount_satang: amountSatang,
          note
        };
      }
      resetForm();
    } else {
      state.transactions.push({
        id: "tx_" + Date.now(),
        date,
        main_category: mainCat,
        sub_category: subCat,
        amount_satang: amountSatang,
        note
      });
      document.getElementById("txAmount").value = "";
      document.getElementById("txNote").value = "";
    }

    saveState();
    renderSummaryAndList();
  });

  window.editTx = function (id) {
    const tx = state.transactions.find(t => t.id === id);
    if (!tx) return;
    document.getElementById("editTxId").value = tx.id;
    document.getElementById("txDate").value = tx.date;
    document.getElementById("txAmount").value = (tx.amount_satang / 100).toFixed(2);
    document.getElementById("txMainCat").value = tx.main_category;
    populateSubCategories();
    document.getElementById("txSubCat").value = tx.sub_category;
    document.getElementById("txNote").value = tx.note || "";
    document.getElementById("btnCancelEdit").classList.remove("hidden");

    // สลับไปหน้าบันทึกรายการ
    switchTab("viewEntry");
  };

  window.deleteTx = function (id) {
    if (!confirm("ยืนยันการลบรายการนี้?")) return;
    state.transactions = state.transactions.filter(t => t.id !== id);
    saveState();
    renderSummaryAndList();
  };

  function resetForm() {
    document.getElementById("editTxId").value = "";
    document.getElementById("txDate").value = formatDateISO(new Date());
    document.getElementById("txAmount").value = "";
    document.getElementById("txNote").value = "";
    document.getElementById("btnCancelEdit").classList.add("hidden");
  }

  document.getElementById("btnCancelEdit").addEventListener("click", resetForm);
  document.getElementById("txMainCat").addEventListener("change", populateSubCategories);

  // สลับแท็บหน้าจอ
  function switchTab(viewId) {
    ["viewEntry", "viewHistory", "viewDashboard"].forEach(id => {
      document.getElementById(id).classList.toggle("hidden", id !== viewId);
    });
    document.querySelectorAll(".nav-tabs .px-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === viewId);
    });
  }

  document.querySelectorAll(".nav-tabs .px-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.view));
  });

  // สลับ Theme Day / Night
  document.getElementById("btnToggleTheme").addEventListener("click", () => {
    const html = document.documentElement;
    const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", next);
    state.settings.theme = next;
    saveState();
    renderSummaryAndList(); // อัปเดตสีตัวอักษร Net Balance ทันทีที่สลับธีม
  });

  // เลื่อนรอบบัญชี
  document.getElementById("btnPrevCycle").addEventListener("click", () => {
    cycleOffset -= 1;
    renderSummaryAndList();
  });
  document.getElementById("btnNextCycle").addEventListener("click", () => {
    cycleOffset += 1;
    renderSummaryAndList();
  });

  document.getElementById("filterMainCat").addEventListener("change", renderSummaryAndList);
  document.getElementById("dashCycleMode").addEventListener("change", renderDashboard);

  // Export CSV & JSON
  document.getElementById("btnExportCsv").addEventListener("click", () => {
    const header = "ID,Date,Main_Category,Sub_Category,Amount_THB,Note\n";
    const rows = state.transactions.map(t =>
      `"${t.id}","${t.date}","${t.main_category}","${t.sub_category}",${(t.amount_satang / 100).toFixed(2)},"${(t.note || "").replace(/"/g, '""')}"`
    ).join("\n");
    const blob = new Blob(["\uFEFF" + header + rows], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ploys_ledger_${formatDateISO(new Date())}.csv`;
    a.click();
  });

  document.getElementById("btnExportJson").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ploys_ledger_${formatDateISO(new Date())}.json`;
    a.click();
  });

  // เริ่มต้นทำงาน
  loadState();
  document.documentElement.setAttribute("data-theme", state.settings.theme || "dark");
  document.getElementById("txDate").value = formatDateISO(new Date());
  populateSubCategories();
  renderSummaryAndList();
</script>
</body>
</html>
